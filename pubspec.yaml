name: notelet
description: Rich, paged release notes in a bottom sheet for Flutter apps, with list, image and video notes and automatic "seen version" tracking.
version: 1.0.0
homepage:
repository: https://github.com/KhaleelSH/notelet

environment:
  sdk: ^3.13.5
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  package_info_plus: ^10.2.2
  shared_preferences: ^2.5.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  video_player_platform_interface: ^6.9.0
